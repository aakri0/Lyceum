{% extends "base.html" %}
{% block title %}New Password{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Set a new password</h2>
    <p class="subtitle">Minimum 8 characters. Mix letters and digits. Cannot match a top-100 common password or contain your name / email.</p>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>New password</label>
        <input type="password" name="password" placeholder="••••••••" required autofocus minlength="8">
      </div>
      <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" name="confirm" placeholder="••••••••" required minlength="8">
      </div>
      <button type="submit" class="btn btn-block btn-lg">
        Set new password <svg class="icon"><use href="#i-shield"/></svg>
      </button>
    </form>

    <div class="auth-footer">
      <a href="/">&larr; Back to home</a>
    </div>
  </div>
</div>
{% endblock %}
