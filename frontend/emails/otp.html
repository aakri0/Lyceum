<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lyceum Login Code</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f6f7fb; margin:0; padding:24px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"
         style="max-width:480px; width:100%; background:#ffffff; border-radius:8px;
                box-shadow:0 1px 3px rgba(15,23,42,0.08); padding:32px;">
    <tr>
      <td>
        <h1 style="margin:0 0 12px; font-size:20px; color:#0f172a;">Your Lyceum login code</h1>
        <p style="margin:0 0 24px; font-size:14px; color:#475569; line-height:1.5;">
          Use the 6-digit code below to finish signing in. It expires in
          <strong>5 minutes</strong>.
        </p>
        <div style="background:#0f172a; color:#ffffff; font-family:'SF Mono', Menlo, monospace;
                    font-size:28px; letter-spacing:8px; text-align:center; padding:18px 0;
                    border-radius:6px; user-select:all;">
          {{ otp }}
        </div>
        <p style="margin:24px 0 0; font-size:12px; color:#64748b; line-height:1.5;">
          Didn't try to log in? You can ignore this message — your account is
          fine — but consider changing your password if you weren't expecting it.
        </p>
        <hr style="border:none; border-top:1px solid #e2e8f0; margin:24px 0 12px;">
        <p style="margin:0; font-size:11px; color:#94a3b8;">Lyceum &middot; automated message, do not reply</p>
      </td>
    </tr>
  </table>
</body>
</html>
