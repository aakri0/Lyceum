{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Reset your password</h2>
    <p class="subtitle">If an account exists for the email below, we'll send a one-time reset link valid for 15 minutes.</p>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@college.edu" required autofocus>
      </div>
      <button type="submit" class="btn btn-block btn-lg">
        Send reset link <svg class="icon"><use href="#i-link"/></svg>
      </button>
    </form>

    <div class="auth-footer">
      <a href="/">&larr; Back to home</a>
    </div>
  </div>
</div>
{% endblock %}
