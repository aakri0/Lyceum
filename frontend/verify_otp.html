{% extends "base.html" %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Two-factor verification</h2>
    <p class="subtitle">Enter the 6-digit code we just emailed you. Valid for 5 minutes.</p>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>One-time code</label>
        <input type="text"
               name="otp"
               inputmode="numeric"
               pattern="[0-9]{6}"
               placeholder="••••••"
               maxlength="6"
               autocomplete="one-time-code"
               autofocus
               required
               style="text-align:center; letter-spacing:0.6rem; font-size:1.5rem; font-weight:600; font-family: var(--font-mono); padding: 14px;">
      </div>
      <button type="submit" class="btn btn-block btn-lg">
        Verify <svg class="icon"><use href="#i-check"/></svg>
      </button>
    </form>

    <div class="auth-footer">
      Didn't receive a code?
      <a href="{{ url_for('resend_otp') }}">Resend OTP</a>
    </div>
  </div>
</div>
{% endblock %}
