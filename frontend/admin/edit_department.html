{% extends "base.html" %}
{% block title %}Edit Department{% endblock %}

{% block content %}
<div class="page-header">
  <div class="title-block">
    <h1>Edit department</h1>
    <div class="subtitle">Rename or update <strong>{{ department.dept_name }}</strong>.</div>
  </div>
</div>

<div class="card" style="max-width: 540px;">
  <div class="card-body">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Department name</label>
        <input type="text" name="dept_name" value="{{ department.dept_name }}" required autofocus>
        <div class="form-help">Changes will reflect immediately wherever this department is referenced.</div>
      </div>
      <div class="d-flex" style="gap: var(--sp-2);">
        <button type="submit" class="btn">
          <svg class="icon"><use href="#i-check"/></svg> Save changes
        </button>
        <a href="{{ url_for('admin_manage_departments') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
