{% extends "base.html" %}
{% block title %}Choose your password{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Choose your password</h2>
    <p class="subtitle">Your administrator created this account with a temporary password. Set a new one to continue.</p>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>New password</label>
        <input type="password" name="password" placeholder="••••••••" required autofocus minlength="8">
      </div>
      <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" name="confirm" placeholder="••••••••" required minlength="8">
      </div>
      <button type="submit" class="btn btn-block btn-lg">
        Save and continue <svg class="icon"><use href="#i-check"/></svg>
      </button>
    </form>
  </div>
</div>
{% endblock %}
