{% extends "base.html" %}
{% block title %}Student Login{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Student sign-in</h2>
    <p class="subtitle">After your password, we'll send a 6-digit OTP to your email.</p>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@college.edu" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-block btn-lg">
        Continue <svg class="icon"><use href="#i-check"/></svg>
      </button>
    </form>

    <div class="auth-footer">
      <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
      <span class="text-subtle">·</span>
      <a href="{{ url_for('faculty_login') }}">Faculty</a>
      <span class="text-subtle">·</span>
      <a href="{{ url_for('admin_login') }}">Admin</a>
    </div>
  </div>
</div>
{% endblock %}
