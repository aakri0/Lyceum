{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-header">
  <div class="title-block">
    <h1>Change password</h1>
    <div class="subtitle">Use your current password to set a new one.</div>
  </div>
</div>

<div class="card" style="max-width:520px;">
  <div class="card-body">
    <div class="alert info alert-inline">
      <svg class="icon" width="18" height="18"><use href="#i-info"/></svg>
      <div>
        <strong>Password rules:</strong> at least 8 characters; mix letters and digits;
        not on a common-passwords list; cannot contain your name or email.
      </div>
    </div>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Current password</label>
        <input type="password" name="current_password" required autocomplete="current-password">
      </div>
      <div class="form-group">
        <label>New password</label>
        <input type="password" name="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" name="confirm" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn">
        Save new password <svg class="icon"><use href="#i-shield"/></svg>
      </button>
    </form>
  </div>
</div>
{% endblock %}
