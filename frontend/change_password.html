{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper" style="align-items:flex-start;margin-top:2rem;">
  <div class="card auth-card">
    <h2 class="mb-4">Change Password</h2>
    <p class="text-muted">
      Minimum 8 characters; must mix letters and digits; cannot match a
      common-passwords list or contain your name / email.
    </p>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Current password</label>
        <input type="password" name="current_password" required class="form-control">
      </div>
      <div class="form-group">
        <label>New password</label>
        <input type="password" name="password" required minlength="8" class="form-control">
      </div>
      <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" name="confirm" required minlength="8" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary mt-2"
              style="width:auto;padding:0.5rem 1.5rem;">Change Password</button>
    </form>
  </div>
</div>
{% endblock %}
